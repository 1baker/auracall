name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
        node: [22, 24]
        exclude:
          - os: macos-latest
            node: 24
          - os: windows-2022
            node: 24

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:ci-runtime
      - run: pnpm run lint
      - name: Run full test suite on supported Unix hosts
        if: matrix.os != 'windows-2022'
        run: pnpm run test
      - name: Run Windows runtime-contract tests
        if: matrix.os == 'windows-2022'
        run: pnpm exec vitest run tests/scripts/ciRuntimeContract.test.ts tests/scripts/dashboardSessionReadinessSmoke.test.ts tests/runtime.runnersStore.test.ts tests/runtime.runnersControl.test.ts
      - name: Run real readiness smoke on every supported OS
        run: pnpm run smoke:dashboard-session-readiness
      - run: pnpm run build
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
